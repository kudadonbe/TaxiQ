name: CI

on:
  push:
    branches: [v2, v3]
  pull_request:

# Least privilege: this workflow only reads the code.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taxiq
          POSTGRES_PASSWORD: taxiq
          POSTGRES_DB: taxiq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taxiq" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://taxiq:taxiq@localhost:5432/taxiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @taxiq/server typecheck
      - run: pnpm --filter @taxiq/server test
