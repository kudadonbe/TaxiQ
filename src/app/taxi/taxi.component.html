<div *ngFor="let taxi of taxiQ" class="taxiInfo" [ngClass]="{ taxiSelected: taxi.selected }">
    <div class="taxiInQ" (click)="onSelect(taxi)" (dblclick)="deselect(taxi)" (touchstart)="onTouch(taxi, $event)">
        <div class="vehicle">
            <div class="vNumber">{{taxi.taxiNo}}</div>
            <div class="vReg">{{taxi.taxiReg}}</div>
        </div>
        <div class="driver">
            <div class="driverDetails">
                <div class="driverPhonto">
                    <img [src]="setPhoto(taxi.driver.name)" height="50vm" alt="Driver Photo" srcset="">
                </div>
                <div class="driverContact">
                    <div class="dirverName">{{taxi.driver.name}}</div>
                    <div class="driverMobile">{{taxi.driver.phone}}</div>
                </div>
            </div>
        </div>
    </div>
    <div *ngIf="taxi.selected" [ngClass]="{ assign: taxi.selected }">
        <div class="btn" (click)="onAssign(taxi)">ASSIGN</div>
    </div>
</div>
